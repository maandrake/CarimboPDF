[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carimbopdf"
version = "3.0.0"
description = "Carimbo de cidade e data em PDFs, com interface gráfica e CLI"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.26,<2", "Pillow>=11,<13", "tkcalendar>=1.6.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pyinstaller>=6,<7"]

[project.scripts]
carimbopdf = "data_hora_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
